<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <rect width="400" height="240" rx="20" fill="#e0f2fe"/>
  <path d="M0 170 Q160 150 320 170 T400 165 L400 240 L0 240 Z" fill="#bae6fd"/>
  <circle cx="340" cy="55" r="28" fill="#fde047"/>

  <!-- Water Pitcher (Clay Jar) -->
  <path d="M165 95 L195 95 L210 120 L215 180 L145 180 L150 120 Z" fill="#fb923c" stroke="#c2410c" stroke-width="3"/>
  <ellipse cx="180" cy="95" rx="15" ry="6" fill="#ea580c"/>
  <!-- Rising Blue Water -->
  <path d="M152 145 Q180 140 208 145 L213 178 L147 178 Z" fill="#38bdf8" opacity="0.85"/>
  <ellipse cx="180" cy="145" rx="28" ry="6" fill="#7dd3fc"/>
  <!-- Dropped Pebbles in Water -->
  <ellipse cx="170" cy="170" rx="8" ry="6" fill="#94a3b8"/>
  <ellipse cx="190" cy="172" rx="7" ry="5" fill="#64748b"/>
  <ellipse cx="180" cy="165" rx="9" ry="6" fill="#475569"/>

  <!-- Smart Little Black Crow -->
  <!-- Body -->
  <ellipse cx="270" cy="130" rx="30" ry="24" fill="#334155"/>
  <!-- Head -->
  <circle cx="240" cy="105" r="18" fill="#1e293b"/>
  <!-- Eye -->
  <circle cx="236" cy="102" r="5" fill="#fff"/>
  <circle cx="235" cy="102" r="2.5" fill="#000"/>
  <!-- Beak holding a small pebble -->
  <polygon points="222,106 200,110 222,114" fill="#f59e0b"/>
  <ellipse cx="196" cy="113" rx="5" ry="4" fill="#94a3b8"/>
  <!-- Wing -->
  <ellipse cx="280" cy="132" rx="20" ry="12" fill="#0f172a" transform="rotate(-15 280 132)"/>
  <!-- Tail -->
  <polygon points="295,135 325,145 320,130" fill="#1e293b"/>
  <!-- Legs on Ground -->
  <line x1="262" y1="152" x2="260" y2="182" stroke="#f59e0b" stroke-width="3"/>
  <line x1="278" y1="152" x2="280" y2="182" stroke="#f59e0b" stroke-width="3"/>

  <!-- Water Droplets / Splash -->
  <circle cx="180" cy="125" r="3" fill="#0284c7"/>
  <circle cx="172" cy="120" r="2.5" fill="#38bdf8"/>
  <circle cx="188" cy="118" r="2.5" fill="#38bdf8"/>
  <!-- Sparkles -->
  <text x="145" y="80" font-size="20" fill="#38bdf8">✨</text>
</svg>
