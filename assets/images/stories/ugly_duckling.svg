<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <rect width="400" height="240" rx="20" fill="#e0f2fe"/>
  <!-- Clear Blue Lake -->
  <path d="M0 135 Q100 115 200 135 T400 125 L400 240 L0 240 Z" fill="#38bdf8"/>
  <path d="M0 165 Q120 150 240 165 T400 155 L400 240 L0 240 Z" fill="#0284c7"/>

  <!-- Water Lily & Reeds -->
  <ellipse cx="60" cy="180" rx="25" ry="8" fill="#22c55e"/>
  <circle cx="60" cy="178" r="7" fill="#f472b6"/>
  <line x1="370" y1="90" x2="368" y2="160" stroke="#15803d" stroke-width="4"/>
  <line x1="380" y1="80" x2="376" y2="160" stroke="#16a34a" stroke-width="4"/>

  <!-- Little Grey/Yellow Duckling Swimming on Left -->
  <g transform="translate(100, 140)">
    <ellipse cx="28" cy="20" rx="22" ry="14" fill="#94a3b8"/>
    <circle cx="44" cy="10" r="11" fill="#cbd5e1"/>
    <polygon points="53,10 65,13 53,16" fill="#f97316"/>
    <circle cx="47" cy="8" r="2" fill="#000"/>
    <circle cx="48" cy="7" r="0.8" fill="#fff"/>
    <!-- Water Ripple -->
    <ellipse cx="26" cy="30" rx="28" ry="4" fill="none" stroke="#bae6fd" stroke-width="2"/>
  </g>

  <!-- Majestic Graceful White Swan on Right looking back -->
  <g transform="translate(240, 95)">
    <!-- Body -->
    <ellipse cx="55" cy="55" rx="42" ry="24" fill="#ffffff"/>
    <!-- Wing Feathers -->
    <path d="M30 45 C45 35 75 35 90 55 C75 52 45 52 30 45 Z" fill="#f1f5f9"/>
    <!-- Graceful S-Curved Neck -->
    <path d="M78 50 C86 35 78 15 65 10 C56 6 52 14 55 22 C58 30 68 45 74 54" stroke="#ffffff" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- Head & Beak -->
    <circle cx="56" cy="14" r="8" fill="#ffffff"/>
    <polygon points="50,14 36,17 50,19" fill="#ea580c"/>
    <polygon points="52,14 48,15 50,19" fill="#0f172a"/>
    <circle cx="54" cy="12" r="2" fill="#000"/>
    <!-- Water Ripple around Swan -->
    <ellipse cx="55" cy="74" rx="46" ry="6" fill="none" stroke="#e0f2fe" stroke-width="2.5"/>
  </g>

  <!-- Sparkles of Transformation -->
  <text x="185" y="110" font-size="22">✨</text>
  <text x="210" y="85" font-size="20">💖</text>
</svg>
