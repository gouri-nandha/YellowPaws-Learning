<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <rect width="400" height="240" rx="20" fill="#fef9c3"/>
  <!-- Rolling Green Meadow Hills -->
  <path d="M0 130 Q120 100 240 130 T400 120 L400 240 L0 240 Z" fill="#bbf7d0"/>
  <path d="M0 165 Q160 145 320 165 T400 160 L400 240 L0 240 Z" fill="#86efac"/>

  <!-- Fluffy White Sheep -->
  <g transform="translate(60, 140)">
    <circle cx="20" cy="20" r="16" fill="#fff"/>
    <circle cx="34" cy="22" r="14" fill="#fff"/>
    <circle cx="26" cy="12" r="13" fill="#fff"/>
    <circle cx="38" cy="14" r="9" fill="#1e293b"/>
    <circle cx="39" cy="13" r="1.5" fill="#fff"/>
    <line x1="16" y1="32" x2="16" y2="44" stroke="#1e293b" stroke-width="3"/>
    <line x1="28" y1="32" x2="28" y2="44" stroke="#1e293b" stroke-width="3"/>
  </g>
  <g transform="translate(120, 150)">
    <circle cx="16" cy="16" r="14" fill="#fff"/>
    <circle cx="28" cy="18" r="12" fill="#fff"/>
    <circle cx="32" cy="12" r="8" fill="#1e293b"/>
    <line x1="14" y1="28" x2="14" y2="38" stroke="#1e293b" stroke-width="3"/>
    <line x1="24" y1="28" x2="24" y2="38" stroke="#1e293b" stroke-width="3"/>
  </g>

  <!-- Shepherd Boy Shouting on Hill -->
  <g transform="translate(220, 95)">
    <circle cx="30" cy="22" r="18" fill="#fed7aa"/>
    <path d="M12 18 Q30 4 48 18 Z" fill="#b45309"/>
    <circle cx="26" cy="20" r="2.5" fill="#1e293b"/>
    <circle cx="36" cy="20" r="2.5" fill="#1e293b"/>
    <!-- Open Mouth shouting 'Wolf!' -->
    <ellipse cx="31" cy="29" rx="5" ry="4" fill="#ef4444"/>
    <rect x="18" y="40" width="24" height="32" rx="4" fill="#3b82f6"/>
    <!-- Shepherd's Staff -->
    <line x1="50" y1="20" x2="50" y2="90" stroke="#78350f" stroke-width="3.5"/>
    <path d="M50 20 C50 10 60 10 60 20" stroke="#78350f" stroke-width="3.5" fill="none"/>
  </g>

  <!-- Cartoon Wolf Sneaking Behind Tree -->
  <g transform="translate(325, 80)">
    <circle cx="25" cy="50" r="25" fill="#166534"/>
    <!-- Wolf Head peering -->
    <polygon points="10,40 -10,50 10,60" fill="#475569"/>
    <polygon points="5,38 10,22 18,36" fill="#334155"/>
    <circle cx="-10" cy="50" r="2.5" fill="#0f172a"/>
    <circle cx="2" cy="46" r="3" fill="#facc15"/>
    <circle cx="2" cy="46" r="1.5" fill="#000"/>
  </g>
</svg>
