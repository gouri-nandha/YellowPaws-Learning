<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="savannahSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe5b4"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9c46a"/>
      <stop offset="100%" stop-color="#f4a261"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="20" fill="url(#savannahSky)"/>
  <path d="M0 160 Q120 140 250 165 T400 160 L400 240 L0 240 Z" fill="url(#groundGrad)"/>
  
  <!-- Friendly Big Lion -->
  <!-- Mane -->
  <circle cx="180" cy="115" r="75" fill="#e76f51"/>
  <!-- Body -->
  <ellipse cx="230" cy="170" rx="60" ry="40" fill="#f4a261"/>
  <!-- Face -->
  <circle cx="180" cy="115" r="50" fill="#e9c46a"/>
  <!-- Ears -->
  <circle cx="140" cy="75" r="14" fill="#e76f51"/>
  <circle cx="140" cy="75" r="8" fill="#f4a261"/>
  <circle cx="220" cy="75" r="14" fill="#e76f51"/>
  <circle cx="220" cy="75" r="8" fill="#f4a261"/>
  <!-- Eyes -->
  <ellipse cx="165" cy="105" rx="6" ry="8" fill="#264653"/>
  <ellipse cx="195" cy="105" rx="6" ry="8" fill="#264653"/>
  <circle cx="167" cy="103" r="2.5" fill="#fff"/>
  <circle cx="197" cy="103" r="2.5" fill="#fff"/>
  <!-- Nose & Smile -->
  <polygon points="180,120 172,112 188,112" fill="#e76f51"/>
  <path d="M172 125 Q180 135 188 125" stroke="#264653" stroke-width="3" fill="none"/>
  <!-- Paws -->
  <ellipse cx="160" cy="190" rx="16" ry="12" fill="#e9c46a"/>
  <ellipse cx="210" cy="190" rx="20" ry="14" fill="#e9c46a"/>

  <!-- Tiny Cute Grey Mouse Friend Sitting on Big Paw -->
  <ellipse cx="210" cy="172" rx="14" ry="10" fill="#adb5bd"/>
  <circle cx="220" cy="168" r="8" fill="#ced4da"/>
  <!-- Mouse Ears -->
  <circle cx="216" cy="160" r="5" fill="#ffb7b2"/>
  <circle cx="224" cy="160" r="5" fill="#ffb7b2"/>
  <!-- Mouse Eye & Nose -->
  <circle cx="224" cy="167" r="1.5" fill="#212529"/>
  <circle cx="228" cy="168" r="1.5" fill="#ff758f"/>
  <!-- Mouse Tail -->
  <path d="M196 174 Q190 170 192 162" stroke="#adb5bd" stroke-width="2" fill="none"/>
  <!-- Heart between friends -->
  <path d="M210 145 C210 140 205 136 201 140 C197 136 192 140 192 145 C192 152 201 156 201 159 C201 156 210 152 210 145 Z" fill="#ff4d6d"/>
</svg>
