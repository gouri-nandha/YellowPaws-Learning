<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <rect width="400" height="240" rx="20" fill="#fdf4ff"/>
  <path d="M0 160 Q150 140 300 165 T400 155 L400 240 L0 240 Z" fill="#86efac"/>
  <circle cx="60" cy="50" r="26" fill="#fde047"/>

  <!-- Grapevine Pergola on Top Right -->
  <rect x="230" y="20" width="160" height="12" rx="4" fill="#92400e"/>
  <rect x="360" y="20" width="12" height="160" rx="3" fill="#92400e"/>
  <!-- Green Leaves -->
  <circle cx="260" cy="35" r="14" fill="#22c55e"/>
  <circle cx="285" cy="32" r="16" fill="#16a34a"/>
  <circle cx="310" cy="36" r="15" fill="#22c55e"/>
  <!-- Juicy Purple Grape Bunches hanging high -->
  <g transform="translate(265, 45)">
    <circle cx="10" cy="6" r="7" fill="#7e22ce"/>
    <circle cx="22" cy="6" r="7" fill="#9333ea"/>
    <circle cx="34" cy="6" r="7" fill="#7e22ce"/>
    <circle cx="16" cy="18" r="7" fill="#9333ea"/>
    <circle cx="28" cy="18" r="7" fill="#a855f7"/>
    <circle cx="22" cy="29" r="6" fill="#7e22ce"/>
  </g>
  <g transform="translate(315, 48)">
    <circle cx="10" cy="6" r="6" fill="#7e22ce"/>
    <circle cx="20" cy="6" r="6" fill="#9333ea"/>
    <circle cx="15" cy="16" r="6" fill="#a855f7"/>
    <circle cx="15" cy="26" r="5" fill="#7e22ce"/>
  </g>

  <!-- Cute Orange Fox Jumping Up towards Grapes -->
  <g transform="translate(130, 90)">
    <!-- Fluffy Tail -->
    <path d="M10 50 Q-20 20 -15 0 Q5 15 25 35 Z" fill="#ea580c"/>
    <path d="M-15 0 Q-5 5 5 15 Q-5 2 -15 0 Z" fill="#fff"/>
    <!-- Body -->
    <ellipse cx="60" cy="45" rx="36" ry="20" fill="#f97316" transform="rotate(-30 60 45)"/>
    <!-- Head -->
    <polygon points="90,10 115,25 90,40" fill="#f97316"/>
    <!-- White cheeks -->
    <polygon points="90,25 110,25 90,38" fill="#fff"/>
    <circle cx="114" cy="25" r="3" fill="#000"/>
    <!-- Fox Ears -->
    <polygon points="85,8 92,-8 100,8" fill="#c2410c"/>
    <polygon points="92,10 98,-4 105,12" fill="#c2410c"/>
    <!-- Eyes looking up at grapes -->
    <circle cx="98" cy="18" r="3.5" fill="#1e293b"/>
    <circle cx="99" cy="17" r="1.2" fill="#fff"/>
    <!-- Jumping Paws reaching high -->
    <rect x="75" y="0" width="8" height="24" rx="4" fill="#f97316" transform="rotate(-35 75 0)"/>
    <rect x="88" y="2" width="8" height="22" rx="4" fill="#f97316" transform="rotate(-25 88 2)"/>
  </g>
</svg>
