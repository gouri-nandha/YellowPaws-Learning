<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <rect width="400" height="240" rx="20" fill="#fefce8"/>
  <path d="M0 160 Q150 145 300 160 T400 155 L400 240 L0 240 Z" fill="#fde047"/>

  <!-- Farm Barn Wooden Wall in Background -->
  <rect x="20" y="40" width="360" height="120" rx="10" fill="#fed7aa"/>
  <line x1="20" y1="80" x2="380" y2="80" stroke="#fbd38d" stroke-width="3"/>
  <line x1="20" y1="120" x2="380" y2="120" stroke="#fbd38d" stroke-width="3"/>

  <!-- Cozy Golden Straw Nest -->
  <ellipse cx="200" cy="180" rx="85" ry="32" fill="#ca8a04"/>
  <ellipse cx="200" cy="176" rx="76" ry="24" fill="#eab308"/>

  <!-- Friendly Mother Goose -->
  <g transform="translate(130, 80)">
    <!-- White Body in nest -->
    <ellipse cx="65" cy="72" rx="42" ry="28" fill="#ffffff"/>
    <ellipse cx="60" cy="65" rx="30" ry="16" fill="#f1f5f9"/>
    <!-- Curved Neck & Head -->
    <path d="M85 75 Q96 45 88 25 Q82 12 70 20" stroke="#ffffff" stroke-width="14" stroke-linecap="round" fill="none"/>
    <circle cx="70" cy="20" r="10" fill="#ffffff"/>
    <!-- Orange Beak -->
    <polygon points="62,20 45,24 62,27" fill="#f97316"/>
    <circle cx="68" cy="17" r="2.5" fill="#0f172a"/>
  </g>

  <!-- Big Glowing Solid Golden Egg in Front -->
  <g transform="translate(225, 135)">
    <ellipse cx="22" cy="30" rx="18" ry="24" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
    <ellipse cx="16" cy="24" rx="4" ry="10" fill="#fef08a"/>
  </g>
  <!-- Second Golden Egg -->
  <g transform="translate(170, 145)">
    <ellipse cx="16" cy="22" rx="13" ry="17" fill="#eab308" stroke="#ca8a04" stroke-width="1.5" transform="rotate(-20 16 22)"/>
    <ellipse cx="12" cy="18" rx="3" ry="7" fill="#fef08a"/>
  </g>

  <!-- Golden Stars & Sparkles -->
  <text x="250" y="125" font-size="24">✨</text>
  <text x="175" y="115" font-size="20">⭐</text>
  <text x="210" y="95" font-size="22">✨</text>
</svg>
