<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Area Theme - YellowPaws</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/icons.js"></script>
</head>
<body>

    <div class="theme-container">

        <h1>Choose Environment Area Theme</h1>
        <p style="margin-bottom:20px;">Transform your entire learning world into an exciting environmental area!</p>

        <div class="theme-grid" style="display: flex; justify-content: center; margin: 25px auto; max-width: 320px;">

            <div class="theme-card rainbow" onclick="selectTheme('rainbow')" style="width: 100%;">
                <div class="theme-icon-container" style="margin-bottom:12px;">
                    <img src="assets/images/themes/rainbow.svg" style="width:75px; height:75px; object-fit:contain;" alt="Rainbow">
                </div>
                <h2>Rainbow Meadow</h2>
                <p style="font-size:0.9rem; margin-top:5px;">Cheerful colorful sunshine</p>
            </div>

        </div>

        <p id="selectedTheme" style="font-size: 1.3rem; font-weight: bold; margin: 15px 0;"></p>

        <button onclick="goHome()">
            Back to Hub
        </button>

    </div>

    <script src="js/theme.js"></script>
    <script src="js/timer.js"></script>
</body>
</html>
