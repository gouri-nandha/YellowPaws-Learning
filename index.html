<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YellowPaws Learning</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <div class="container">

        <div class="header-section">
            <h1 class="main-title">🐾 YellowPaws Learning</h1>

            <p id="welcomeMessage" class="subtitle">
                Woof! Ready for a fun learning adventure?
            </p>
        </div>

        <div class="buttons">
            <button onclick="startLearning()">
                Start Learning
            </button>

            <button onclick="location.href='theme.html'">
                Choose Theme
            </button>

            <button onclick="toggleMusic()" id="musicBtn">
                🎵 Music: Off
            </button>

            <button onclick="parentArea()">
                Parent Area
            </button>
        </div>

    </div>

    <script src="js/app.js"></script>

</body>
</html>
