<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YellowPaws Learning</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <div class="container">

        <div class="mascot-section">
            <div class="dog-face">
                <div class="ear left-ear"></div>
                <div class="ear right-ear"></div>

                <div class="eyes">
                    <div class="eye"></div>
                    <div class="eye"></div>
                </div>

                <div class="nose"></div>

                <div class="mouth"></div>
            </div>

            <h1>🐾 YellowPaws Learning</h1>

            <p id="welcomeMessage">
                Woof! Ready for a fun learning adventure?
            </p>
        </div>

        <div class="buttons">
            <button onclick="startLearning()">
                Start Learning
            </button>

            <button onclick="location.href='theme.html'">
                Choose Theme
            </button>

            <button onclick="toggleMusic()" id="musicBtn">
                🎵 Music: Off
            </button>

            <button onclick="parentArea()">
                Parent Area
            </button>
        </div>

    </div>

    <script src="js/app.js"></script>

</body>
</html>
