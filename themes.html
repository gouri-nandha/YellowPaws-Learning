<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Theme</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="theme-container">

        <h1>Choose Your Learning World</h1>

        <div class="theme-grid">

            <div class="theme-card jungle" onclick="selectTheme('jungle')">
                <div style="margin-bottom:10px;">
                    <img src="assets/images/themes/jungle.png" onerror="this.src='assets/images/themes/jungle.svg'" style="width:75px; height:75px; object-fit:contain;" alt="Jungle">
                </div>
                <h2>Jungle Adventure</h2>
            </div>

            <div class="theme-card space" onclick="selectTheme('space')">
                <div style="margin-bottom:10px;">
                    <img src="assets/images/themes/space.svg" style="width:75px; height:75px; object-fit:contain;" alt="Space">
                </div>
                <h2>Space Explorer</h2>
            </div>

            <div class="theme-card ocean" onclick="selectTheme('ocean')">
                <div style="margin-bottom:10px;">
                    <img src="assets/images/themes/ocean.svg" style="width:75px; height:75px; object-fit:contain;" alt="Ocean">
                </div>
                <h2>Ocean World</h2>
            </div>

            <div class="theme-card fantasy" onclick="selectTheme('fantasy')">
                <div style="margin-bottom:10px;">
                    <img src="assets/images/themes/fantasy.svg" style="width:75px; height:75px; object-fit:contain;" alt="Fantasy">
                </div>
                <h2>Fantasy Kingdom</h2>
            </div>

            <div class="theme-card rainbow" onclick="selectTheme('rainbow')">
                <div style="margin-bottom:10px;">
                    <img src="assets/images/themes/rainbow.svg" style="width:75px; height:75px; object-fit:contain;" alt="Rainbow">
                </div>
                <h2>Rainbow Land</h2>
            </div>

        </div>

        <p id="selectedTheme"></p>

        <button onclick="goHome()">
            Back Home
        </button>

    </div>

    <script src="js/themes.js"></script>

</body>
</html>
