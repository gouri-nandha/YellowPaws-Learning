<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Theme</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="theme-container">

        <h1>Choose Your Learning World</h1>

        <div class="theme-grid" style="display: flex; justify-content: center; margin: 25px auto; max-width: 320px;">

            <div class="theme-card rainbow" onclick="selectTheme('rainbow')" style="width: 100%;">
                <div style="margin-bottom:10px;">
                    <img src="assets/images/themes/rainbow.svg" style="width:75px; height:75px; object-fit:contain;" alt="Rainbow">
                </div>
                <h2>Rainbow Meadow</h2>
            </div>

        </div>

        <p id="selectedTheme"></p>

        <button onclick="goHome()">
            Back Home
        </button>

    </div>

    <script src="js/themes.js"></script>

</body>
</html>
