<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Theme</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/icons.js"></script>
</head>
<body>

    <div class="theme-container">

        <h1>Choose Your Learning World</h1>

        <div class="theme-grid">

            <div class="theme-card jungle" onclick="selectTheme('jungle')">
                <div style="margin-bottom:10px;"><script>document.write(YellowPawsIcons.themes.jungle);</script></div>
                <h2>Jungle Adventure</h2>
            </div>

            <div class="theme-card space" onclick="selectTheme('space')">
                <div style="margin-bottom:10px;"><script>document.write(YellowPawsIcons.themes.space);</script></div>
                <h2>Space Explorer</h2>
            </div>

            <div class="theme-card ocean" onclick="selectTheme('ocean')">
                <div style="margin-bottom:10px;"><script>document.write(YellowPawsIcons.themes.ocean);</script></div>
                <h2>Ocean World</h2>
            </div>

            <div class="theme-card fantasy" onclick="selectTheme('fantasy')">
                <div style="margin-bottom:10px;"><script>document.write(YellowPawsIcons.themes.fantasy);</script></div>
                <h2>Fantasy Kingdom</h2>
            </div>

            <div class="theme-card rainbow" onclick="selectTheme('rainbow')">
                <div style="margin-bottom:10px;"><script>document.write(YellowPawsIcons.themes.rainbow);</script></div>
                <h2>Rainbow Land</h2>
            </div>

        </div>

        <p id="selectedTheme"></p>

        <button onclick="goHome()">
            Back Home
        </button>

    </div>

    <script src="js/themes.js"></script>

</body>
</html>
