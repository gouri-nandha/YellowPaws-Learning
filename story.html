<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moral Story Time - YellowPaws</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="hub-container">
        
        <!-- Story Selection Library View -->
        <div id="storyLibraryView" style="width: 100%;">
            <h1>Moral Story Library</h1>
            <p style="margin-bottom: 20px;">Choose a moral story to read beautiful illustrated tales and earn stars!</p>

            <div class="subject-grid" id="storyGrid">
                <!-- Moral story cards rendered dynamically -->
            </div>

            <br>
            <button onclick="location.href='learninghub.html'">Back to Hub</button>
        </div>

        <!-- Story Reader View -->
        <div id="storyReaderView" style="display: none; width: 100%;">
            <h1 id="storyTitle">Loading Story...</h1>

            <div class="profile-card" style="max-width: 650px; margin: 15px auto; padding: 25px;">
                <img id="storyIllustration" src="" alt="Story Illustration" class="story-image-card">

                <p id="storyText" style="font-size: 1.4rem; line-height: 1.6; margin: 20px 0; font-weight: 600; color: #2c3e50;">
                    Please wait...
                </p>

                <div id="pageNumberDisplay" style="font-weight: bold; color: #777; margin-bottom: 15px;"></div>

                <div class="controls" style="gap: 10px;">
                    <button onclick="previousPage()" style="background-color: #e0e0e0;">Prev</button>
                    <button onclick="readAloud()" style="background-color: #6BCBFF; color: white;">Read Aloud</button>
                    <button onclick="nextPage()" style="background-color: #FFB703;">Next</button>
                </div>
            </div>

            <button onclick="backToLibrary()" style="margin-top: 15px;">Back to Story Library</button>
        </div>

    </div>
    
    <script src="js/storage.js"></script>
    <script src="js/story.js"></script>
    <script src="js/timer.js"></script>
</body>
</html>
