<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Settings - YellowPaws</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="parent-container" style="max-width: 580px; margin-top: 30px;">
        <h1>Preferences & Settings</h1>
        <p style="margin-bottom: 20px; font-weight: bold; color: #555;">Customize your learning voice, volume, and style!</p>

        <!-- Speech Settings -->
        <div class="dashboard-card" style="text-align:left;">
            <h2>Speech & Audio Voice</h2>
            
            <div style="margin: 12px 0;">
                <label style="font-weight:bold; display:block; margin-bottom:5px;">Voice Volume:</label>
                <input type="range" id="voiceVolume" min="0" max="1" step="0.1" value="1" style="width:100%;">
            </div>

            <div style="margin: 12px 0;">
                <label style="font-weight:bold; display:block; margin-bottom:5px;">Voice Speed (Rate):</label>
                <input type="range" id="voiceRate" min="0.5" max="2" step="0.1" value="1" style="width:100%;">
            </div>

            <div style="margin: 12px 0;">
                <label style="font-weight:bold; display:block; margin-bottom:5px;">Voice Pitch:</label>
                <input type="range" id="voicePitch" min="0.5" max="2" step="0.1" value="1" style="width:100%;">
            </div>

            <div style="margin: 15px 0; display:flex; justify-content:space-between; align-items:center;">
                <label style="font-weight:bold;">Default Read Aloud On:</label>
                <input type="checkbox" id="readAloudDefault" style="width:24px; height:24px;">
            </div>
            
            <button onclick="testSpeechSettings()" style="background:#6BCBFF; color:white; width:100%;">Test Voice Settings</button>
        </div>

        <!-- Personalization -->
        <div class="dashboard-card">
            <h2>Select Learning Theme</h2>
            <button onclick="location.href='theme.html'" style="background:#FFB703; color:white; width:100%;">Change World Theme</button>
        </div>

        <!-- Danger Zone -->
        <div class="dashboard-card">
            <h2>Danger Zone</h2>
            <button onclick="resetApp()" style="background-color: #ff6b6b; color: white; width:100%;">Reset App Data</button>
        </div>

        <button onclick="location.href='learninghub.html'" style="width:100%;">Back to Hub</button>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/timer.js"></script>
</body>
</html>
