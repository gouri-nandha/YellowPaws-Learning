<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login & Profile - YellowPaws</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="profile-container" style="max-width: 500px;">
        <img src="assets/mascot/yellowpaws_logo.png" onerror="this.src='file:///C:/Users/gouri/.gemini/antigravity-ide/brain/c86b4cca-6a8a-4a8e-857e-dd3b5eb76b6b/yellowpaws_logo_1786774952499.png'" alt="YellowPaws Mascot" class="mascot-logo" style="width:120px; height:120px;">
        
        <h1 id="formHeading">Account & Profile</h1>

        <div style="display:flex; gap:10px; margin-bottom:20px; width:100%;">
            <button id="tabRegister" onclick="switchMode('register')" style="flex:1; background:#FFB703;">New Account</button>
            <button id="tabLogin" onclick="switchMode('login')" style="flex:1; background:#e0e0e0;">User Login</button>
        </div>

        <!-- Login / Register Form -->
        <div style="width:100%; text-align:left;">
            <label style="font-weight:bold; display:block; margin:8px 0 4px 0;">Username</label>
            <input type="text" id="username" placeholder="Enter username" style="width:100%;">

            <label style="font-weight:bold; display:block; margin:12px 0 4px 0;">Password</label>
            <input type="password" id="password" placeholder="Enter password" style="width:100%;">

            <div id="registerFields">
                <label style="font-weight:bold; display:block; margin:12px 0 4px 0;">Nickname</label>
                <input type="text" id="nickname" placeholder="e.g. Alex" maxlength="15" style="width:100%;">

                <label style="font-weight:bold; display:block; margin:15px 0 8px 0;">Pick your Avatar</label>
                <div class="avatar-card-grid">
                    <div class="avatar-card selected" onclick="selectAvatar('Puppy')">
                        <img src="assets/avatars/puppy.svg" style="width:48px; height:48px; object-fit:contain;" alt="Puppy">
                        <span class="avatar-label" style="font-size:0.75rem; margin-top:4px;">Puppy</span>
                    </div>
                    <div class="avatar-card" onclick="selectAvatar('Kitten')">
                        <img src="assets/avatars/kitten.svg" style="width:48px; height:48px; object-fit:contain;" alt="Kitten">
                        <span class="avatar-label" style="font-size:0.75rem; margin-top:4px;">Kitten</span>
                    </div>
                    <div class="avatar-card" onclick="selectAvatar('Lion Cub')">
                        <img src="assets/avatars/lion.svg" style="width:48px; height:48px; object-fit:contain;" alt="Lion Cub">
                        <span class="avatar-label" style="font-size:0.75rem; margin-top:4px;">Lion Cub</span>
                    </div>
                    <div class="avatar-card" onclick="selectAvatar('Bunny')">
                        <img src="assets/avatars/bunny.svg" style="width:48px; height:48px; object-fit:contain;" alt="Bunny">
                        <span class="avatar-label" style="font-size:0.75rem; margin-top:4px;">Bunny</span>
                    </div>
                </div>
            </div>
        </div>

        <br>

        <button id="submitBtn" onclick="handleSubmit()" style="width:100%;">
            Save & Continue
        </button>

        <p id="message" style="margin-top:15px; font-weight:bold;"></p>
        
        <button onclick="location.href='index.html'" style="background-color:#e0e0e0; margin-top:10px;">
            Back Home
        </button>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/timer.js"></script>
</body>
</html>
