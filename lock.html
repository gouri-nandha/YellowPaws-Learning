<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time's Up!</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-color: #333;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .lock-container {
            background: #444;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 3rem;
            color: #ff6b6b;
        }
    </style>
</head>
<body>
    <div class="lock-container">
        <h1>⏰ Time's Up!</h1>
        <h2>You've done a great job learning today.</h2>
        <p>Your screen time limit has been reached.</p>
        <br>
        <button onclick="location.href='parent.html'" style="background-color: #ffb703; color: #333;">Parent Unlock</button>
    </div>
</body>
</html>
