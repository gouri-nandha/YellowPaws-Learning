<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alphabet Learning - YellowPaws</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="alphabet-container">

        <h1>Learn the Alphabet</h1>

        <div class="alphabet-card" style="padding: 25px 20px;">

            <h2 id="letter" style="font-size:4rem; color:#FFB703; margin-bottom:5px;">A</h2>

            <div id="badgeTag" style="margin:10px auto; display:flex; justify-content:center; align-items:center; min-height:95px;">
                <!-- Vector SVG rendered by JS -->
            </div>

            <h3 id="word" style="font-size:1.8rem; margin-top:10px;">
                A for Apple
            </h3>

        </div>

        <div class="controls" style="margin-top:20px;">

            <button onclick="previousLetter()">
                Previous
            </button>

            <button onclick="speakLetter()">
                Speak
            </button>

            <button onclick="testPronunciation()" style="background-color: #6BCBFF;">
                Pronounce
            </button>

            <button onclick="nextLetter()">
                Next
            </button>

        </div>

        <br>

        <button onclick="location.href='learninghub.html'">
            Back to Hub
        </button>

    </div>

    <script src="js/icons.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/speech.js"></script>
    <script src="js/alphabet.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/timer.js"></script>

</body>

</html>
