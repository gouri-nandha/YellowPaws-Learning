<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numbers Learning - YellowPaws</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="numbers-container">

        <h1>Learn Numbers</h1>

        <div class="number-card" style="padding: 24px 16px; min-height: 220px; display: flex; flex-direction: column; align-items: center; justify-content: center;">

            <h2 id="number" style="font-size:3.8rem; color:#FFB703; margin-bottom:4px;">1</h2>

            <div id="objects" class="objects" style="margin:8px auto; min-height:55px; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;">
                <!-- Kids friendly item images or count pill rendered here -->
            </div>

            <h3 id="numberText" style="font-size:1.8rem; margin-top:8px;">
                One
            </h3>

        </div>

        <div class="controls">

            <button onclick="previousNumber()">
                Previous
            </button>

            <button onclick="speakNumber()">
                Speak
            </button>

            <button onclick="testPronunciation()" style="background-color: #6BCBFF;">
                Pronounce
            </button>

            <button onclick="nextNumber()">
                Next
            </button>

        </div>

        <br>

        <button onclick="location.href='learninghub.html'">
            Back to Hub
        </button>

    </div>

    <script src="js/storage.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/speech.js"></script>
    <script src="js/numbers.js"></script>
    <script src="js/timer.js"></script>

</body>

</html>
