<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors Learning - YellowPaws</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="colors-container">

        <h1>Learn Colors</h1>

        <div class="color-card">

            <div id="colorBox" class="color-box" style="width:120px; height:120px; border-radius:20px; margin: 15px auto;"></div>

            <h2 id="colorName">Red</h2>

        </div>

        <div class="controls">

            <button onclick="previousColor()">
                Previous
            </button>

            <button onclick="speakColor()">
                Speak
            </button>

            <button onclick="nextColor()">
                Next
            </button>

        </div>

        <br>

        <button onclick="location.href='learninghub.html'">
            Back to Hub
        </button>

    </div>

    <script src="js/colors.js"></script>
    <script src="js/timer.js"></script>

</body>

</html>
