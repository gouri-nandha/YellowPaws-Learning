<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shapes Learning - YellowPaws</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="shapes-container">

        <h1>🔷 Learn Shapes</h1>

        <div class="shape-card">

            <div id="shapeEmoji" class="shape-emoji">
                ⚪
            </div>

            <h2 id="shapeName">
                Circle
            </h2>

        </div>

        <div class="controls">

            <button onclick="previousShape()">
                ⬅ Previous
            </button>

            <button onclick="speakShape()">
                🔊 Speak
            </button>

            <button onclick="nextShape()">
                Next ➡
            </button>

        </div>

        <br>

        <button onclick="location.href='learninghub.html'">
            🏠 Back to Hub
        </button>

    </div>

    <script src="js/shapes.js"></script>
    <script src="js/timer.js"></script>

</body>

</html>
