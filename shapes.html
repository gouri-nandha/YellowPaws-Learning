<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shapes Learning - YellowPaws</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="shapes-container">

        <h1>Learn Shapes</h1>

        <div class="shape-card" style="padding: 30px 20px;">

            <div id="shapeEmoji" class="shape-emoji" style="margin:10px auto; display:flex; justify-content:center; align-items:center; min-height:100px;">
                <!-- Vector SVG rendered by JS -->
            </div>

            <h2 id="shapeName" style="font-size:2rem; margin-top:15px;">
                Circle
            </h2>

        </div>

        <div class="controls" style="margin-top:20px;">

            <button onclick="previousShape()">
                Previous
            </button>

            <button onclick="speakShape()">
                Speak
            </button>

            <button onclick="nextShape()">
                Next
            </button>

        </div>

        <br>

        <button onclick="location.href='learninghub.html'">
            Back to Hub
        </button>

    </div>

    <script src="js/icons.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/shapes.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/timer.js"></script>

</body>

</html>
