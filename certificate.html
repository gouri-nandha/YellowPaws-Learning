<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YellowPaws Certificate</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="certificate-page">

        <h1>Achievement Certificate</h1>

        <div class="certificate" id="certificate">

            <h2>YellowPaws Learning App</h2>

            <h1>CERTIFICATE OF ACHIEVEMENT</h1>

            <p>This certificate is proudly presented to</p>

            <h2 id="childName">Student</h2>

            <p>for outstanding learning and participation.</p>

            <h3 id="certificateTitle">
                Rising Learner
            </h3>

            <p>
                Total Stars Earned:
                <span id="starCount">0</span> Stars
            </p>

            <p id="certificateDate"></p>

        </div>

        <br>

        <button onclick="window.print()">
            Print Certificate
        </button>

        <button onclick="location.href='learninghub.html'">
            Back to Hub
        </button>

    </div>

    <script src="js/storage.js"></script>
    <script src="js/certificate.js"></script>
    <script src="js/timer.js"></script>

</body>

</html>
